<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Tienda Atenea Makeup</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Lato', sans-serif; 
            background: transparent; 
            color: #4a3f35;
            overflow-x: hidden;
            scrollbar-width: thin; 
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        /* --- CONTENEDOR GRID PARA 1000 PRODUCTOS --- */
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- DESLIZADORES TRASLÚCIDOS --- */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(2px);
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        .card-atenea {
            width: 100%;
            max-width: 240px;
            background: #faf6f0;
            border: 1px solid #f0e6d8;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
            margin: 0 auto;
        }
        .card-atenea:hover { transform: translateY(-2px); }

        .card-atenea .img-container {
            width: 100%;
            aspect-ratio: 1 / 1.1;
            background-color: #ede2cf;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card-atenea .img-container img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: opacity 0.3s ease;
        }

        .card-atenea .img-container .img-hover-preview {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            pointer-events: none;
        }

        .card-atenea .img-container:hover .img-hover-preview { opacity: 1; }

        .card-atenea .info-previa { padding: 14px 12px; }

        .card-atenea .titulo-previa {
            font-size: 14px; font-weight: 400; color: #333333; letter-spacing: 0.8px; margin-bottom: 4px; text-transform: uppercase; cursor: pointer;
        }

        .card-atenea .precio-previa { 
            font-size: 13px; font-weight: 700; color: #333333; margin-bottom: 12px; 
        }

        .btn-ver-pedido-card {
            width: 100%;
            background: #f5f0eb;
            color: #4a3f35;
            border: 1px solid #e3d7cb;
            border-radius: 4px;
            padding: 9px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-ver-pedido-card:hover { background: #ebdcd0; }

        .badge-flotante {
            background: #4a3f35;
            color: #ffffff;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 700;
        }

        .modal-overlay, .modal-carrito-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-content {
            background: #ffffff;
            width: 90vw;
            max-width: 580px;
            max-height: 90vh;
            border-radius: 4px;
            overflow-y: auto;
            position: relative;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            color: #4a4a4a;
            outline: none;
        }

        .carrusel-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }

        .carrusel-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 380px;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 8px;
            border-radius: 4px;
            background: #fdfbf7;
            outline: none;
            scroll-behavior: smooth;
        }

        .carrusel-container img {
            width: 100%; height: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            flex-shrink: 0;
            scroll-snap-align: start;
            cursor: zoom-in;
            background: #ffffff;
            border-radius: 4px;
        }

        .carrusel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 32px; height: 32px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #4a3f35;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer; z-index: 5;
            opacity: 0; transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .carrusel-arrow.visible { opacity: 1; pointer-events: auto; }
        .carrusel-arrow.left { left: 8px; }
        .carrusel-arrow.right { right: 8px; }

        .lightbox-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100000;
            touch-action: none;
            user-select: none;
            overflow: hidden;
        }

        .lightbox-viewport {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .lightbox-viewport img {
            max-width: 90vw; max-height: 85vh;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform;
            transition: transform 0.08s ease-out;
            pointer-events: none;
        }

        .lightbox-cerrar {
            position: fixed; top: 15px; right: 20px;
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; width: 38px; height: 38px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            z-index: 100002; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }

        .lightbox-instruccion {
            position: fixed; bottom: 15px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.75);
            font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;
            pointer-events: none; z-index: 100001;
            background: rgba(0, 0, 0, 0.4); padding: 6px 16px;
            border-radius: 20px; backdrop-filter: blur(4px); white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .carrito-container { 
            width: 100%; max-width: 440px; 
            background: #faf6f0; border: 1px solid #f0e6d8;
            border-radius: 6px; padding: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            position: relative; max-height: 85vh; overflow-y: auto;
        }

        .header-carrito {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 16px; border-bottom: 1px solid #e3d7cb; padding-bottom: 10px;
        }

        .header-carrito-txt {
            font-size: 14px; font-weight: 700; letter-spacing: 1.5px;
            color: #4a3f35; text-transform: uppercase;
        }

        .envio-gratis-bar-container {
            background: #ffffff; border: 1px solid #e0e0e0;
            border-radius: 6px; padding: 12px 14px; margin-bottom: 20px; text-align: center;
        }

        .envio-gratis-txt { font-size: 12px; color: #4a3f35; margin-bottom: 8px; }

        .envio-gratis-progress {
            width: 100%; height: 6px; background: #eeeeee;
            border-radius: 10px; overflow: hidden;
        }

        .envio-gratis-fill { height: 100%; background: #4a3f35; width: 0%; transition: width 0.3s ease; }

        .btn-cerrar, .btn-cerrar-cart {
            position: absolute; top: 12px; right: 14px;
            background: #f5f0eb; border: none; border-radius: 50%;
            width: 28px; height: 28px; font-size: 14px; font-weight: bold;
            color: #666; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
        }

        .prod-titulo { font-size: 22px; font-weight: 400; color: #333333; margin: 0 0 4px 0; letter-spacing: 0.5px; text-transform: uppercase; }
        .prod-precio { font-size: 16px; font-weight: 700; color: #4a4a4a; margin-bottom: 8px; }
        .prod-descripcion { font-size: 13px; font-weight: 400; color: #666666; line-height: 1.5; margin-bottom: 16px; }
        .prod-separador { border: none; border-top: 1px solid #eeeeee; margin: 16px 0; }
        label { display: block; font-size: 11px; font-weight: 700; color: #666666; margin-bottom: 6px; }

        select { 
            width: 100%; padding: 9px 10px; border: 1px solid #cccccc; border-radius: 0px; 
            margin-bottom: 16px; font-size: 12px; outline: none; background: #ffffff; color: #4a4a4a;
        }

        .compra-row { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; }
        
        .cantidad-control { 
            display: flex; align-items: center; border: 1px solid #cccccc; height: 42px; width: 110px; background: #ffffff;
        }
        .btn-cant { width: 34px; height: 100%; background: transparent; border: none; cursor: pointer; font-size: 14px; color: #4a4a4a; }
        .inp-cant { width: 42px; height: 100%; border: none; border-left: 1px solid #eeeeee; border-right: 1px solid #eeeeee; text-align: center; font-weight: bold; font-size: 13px; color: #4a4a4a; }

        .btn-agregar-beige { 
            flex: 1; height: 42px; background: #f5f0eb; color: #4a3f35; border: 1px solid #e3d7cb; 
            font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-agregar-beige:hover { background: #ebdcd0; }

        .envio-box { display: flex; align-items: flex-start; gap: 10px; font-size: 12px; color: #666666; line-height: 1.4; margin-bottom: 16px; }
        
        .truck-icon { width: 20px; height: 20px; fill: #000000; flex-shrink: 0; margin-top: 1px; }

        .pagos-container { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; background: #fafafa; }
        .pagos-titulo { font-size: 11px; color: #666666; margin-bottom: 4px; }

        .item-fila { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #eee8df; font-size: 13px; gap: 10px; }
        .item-nombre { font-weight: 400; color: #333333; letter-spacing: 0.5px; text-transform: uppercase; font-size: 12px; }
        .item-precio { color: #333333; font-weight: 700; font-size: 13px; }
        .cant-contros-cart { display: flex; align-items: center; border: 1px solid #cccccc; background: #ffffff; }
        .btn-cant-cart { width: 26px; height: 26px; background: transparent; border: none; cursor: pointer; font-weight: bold; color: #4a4a4a; }
        .num-cant-cart { width: 28px; text-align: center; font-size: 12px; font-weight: 700; color: #4a4a4a; border-left: 1px solid #eeeeee; border-right: 1px solid #eeeeee; }
        
        .total-fila { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e3d7cb; color: #333333; letter-spacing: 0.5px; }
        
        .btn-realizar-compra { 
            width: 100%; padding: 14px; background: #4a3f35; color: #ffffff; border: none; 
            border-radius: 2px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; 
            text-transform: uppercase; cursor: pointer; margin-top: 16px; transition: background 0.2s ease; 
        }
        .btn-realizar-compra:hover { background: #332b24; }
        .carrito-vacio { text-align: center; color: #888888; padding: 24px 0; font-size: 13px; }
    </style>
</head>
<body>

<!-- CONTENEDOR DONDE SE DIBUJARÁN LOS 1000 PRODUCTOS -->
<div class="catalogo-grid" id="catalogoGrid"></div>

<!-- MODAL DETALLE DE PRODUCTO -->
<div class="modal-overlay" id="modalProducto">
    <div class="modal-content" id="modalContent" tabindex="0">
        <button type="button" class="btn-cerrar" onclick="cerrarModal()">✕</button>

        <div class="carrusel-wrapper">
            <button class="carrusel-arrow left" id="arrowLeft" onclick="scrollCarrusel(-1)">❮</button>
            <div class="carrusel-container" id="carruselImagenes" tabindex="0"></div>
            <button class="carrusel-arrow right" id="arrowRight" onclick="scrollCarrusel(1)">❯</button>
        </div>

        <h2 class="prod-titulo" id="modalTitulo"></h2>
        <div class="prod-precio" id="modalPrecio"></div>
        <p class="prod-descripcion" id="modalDescripcion"></p>

        <hr class="prod-separador">

        <label for="selVariante">Elige tu tono:</label>
        <select id="selVariante"></select>

        <div class="compra-row">
            <div class="cantidad-control">
                <button type="button" class="btn-cant" onclick="cambiarCant(-1)">−0</button>
                <input type="number" id="inpCant" class="inp-cant" value="1" readonly>
                <button type="button" class="btn-cant" onclick="cambiarCant(1)">+</button>
            </div>
            <button type="button" class="btn-agregar-beige" onclick="agregarItem()">AÑADIR AL CARRITO</button>
        </div>

        <div class="envio-box">
            <svg class="truck-icon" viewBox="0 0 24 24">
                <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-7.5l1.96 2.5H17V11h2.5zm-1 7.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
            <div><strong>ENVÍO GRATIS</strong> en compras superiores a <strong>$120.000</strong>. Envíos a toda Colombia.</div>
        </div>

        <div class="pagos-container">
            <div class="pagos-titulo">Transfiere o paga con tu cuenta:</div>
            <div style="font-size: 11px; color: #444; font-weight: 700;">💳 Daviplata | Nequi | Lulo Bank | Breve | Todos los bancos</div>
        </div>
    </div>
</div>

<!-- MODAL CARRITO -->
<div class="modal-carrito-overlay" id="modalCarrito">
    <div class="carrito-container">
        <button type="button" class="btn-cerrar-cart" onclick="cerrarCarrito()">✕</button>
        <div class="header-carrito">
            <span style="font-size: 18px;">🛒</span>
            <span class="header-carrito-txt">TU CARRITO DE COMPRAS</span>
        </div>

        <div class="envio-gratis-bar-container">
            <div class="envio-gratis-txt" id="txtEnvioGratis">¡Agrega <strong>$120.000</strong> más y consigue envío gratuito!</div>
            <div class="envio-gratis-progress">
                <div class="envio-gratis-fill" id="barEnvioGratis"></div>
            </div>
        </div>

        <div id="listaItems"></div>

        <div class="total-fila">
            <span>TOTAL</span>
            <span id="totalPagar">$0 COP</span>
        </div>

        <button type="button" class="btn-realizar-compra" onclick="enviarPedido()">
            REALIZAR COMPRA
        </button>
    </div>
</div>

<!-- LIGHTBOX ZOOM -->
<div class="lightbox-overlay" id="lightboxZoom">
    <button type="button" class="lightbox-cerrar" onclick="cerrarZoom()">✕</button>
    <div class="lightbox-viewport" id="zoomViewport">
        <img id="imgZoomTarget" src="" alt="Foto ampliada">
    </div>
    <div class="lightbox-instruccion">Toca para zoom / Pellizca / Desliza para salir</div>
</div>

<script>
// --- CONFIGURACIÓN GOOGLE SHEETS Y WHATSAPP ---
// Reemplaza esta URL por el Web App de tu Apps Script
// --- CONFIGURACIÓN GOOGLE SHEETS Y WHATSAPP ---
// Tu enlace CSV de Google Sheets
const URL_GOOGLE_SHEETS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR3MrnF2ljSQja7InTGoRPtg-SpCFpsExOBVzGv9ZdLZsDNxhw6_PfTG1ZTgfB_JntJEgsqyoZ023a0/pub?gid=0&single=true&output=csv"; 
const TELEFONO_WA = "573212295023";
const CLAVE_CARRITO = "carrito_global_tienda";
const META_ENVIO = 120000;

let productosBaseDatos = [];
let productoActivo = null;

// Cargar catálogo desde Google Sheets al iniciar
document.addEventListener("DOMContentLoaded", () => {
    cargarProductosDesdeSheets();
    cargarCarrito();
});

async function cargarProductosDesdeSheets() {
    try {
        const res = await fetch(URL_GOOGLE_SHEETS_CSV);
        const csvText = await res.text();
        productosBaseDatos = parsearCSV(csvText);
        renderizarCatalogoGrid();
    } catch (e) {
        console.error("Error cargando Google Sheets:", e);
    }
}

// Convierte las filas del CSV publicado a un arreglo usable por la web
function parsearCSV(csv) {
    const lineas = csv.split("\n").filter(linea => linea.trim() !== "");
    if (lineas.length < 2) return [];

    const encabezados = lineas[0].split(",").map(h => h.trim().replace(/^"|"$/g, ''));
    const productos = [];

    for (let i = 1; i < lineas.length; i++) {
        // Separa por comas respetando textos entre comillas
        const valores = lineas[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lineas[i].split(",");
        const prod = {};

        encabezados.forEach((encabezado, idx) => {
            let val = valores[idx] ? valores[idx].trim().replace(/^"|"$/g, '') : "";
            prod[encabezado] = val;
        });

        if (prod.nombre) {
            productos.push(prod);
        }
    }
    return productos;
}

function renderizarCatalogoGrid() {
    const grid = document.getElementById("catalogoGrid");
    grid.innerHTML = "";

    productosBaseDatos.forEach((prod, index) => {
        const carruselImgs = prod.imagenes ? prod.imagenes.split(",") : [prod.imagenPrincipal];
        const hoverImg = prod.imagenHover || carruselImgs[0] || prod.imagenPrincipal;

        const card = document.createElement("div");
        card.className = "card-atenea";
        card.tabIndex = 0;
        card.innerHTML = `
            <div class="img-container" onclick="abrirModalProducto(${index})">
                <img src="${prod.imagenPrincipal}" alt="${prod.nombre}">
                <img src="${hoverImg}" alt="Vista Previa" class="img-hover-preview">
            </div>
            <div class="info-previa">
                <div class="titulo-previa" onclick="abrirModalProducto(${index})">${prod.nombre}</div>
                <div class="precio-previa">$${Number(prod.precio || 0).toLocaleString("es-CO")} COP</div>
                <button type="button" class="btn-ver-pedido-card" onclick="abrirCarrito()">
                    🛒 Ver Pedido <span class="badge-flotante badgeCant">0</span>
                </button>
            </div>
        `;
        grid.appendChild(card);
    });
    cargarCarrito();
}

function abrirModalProducto(index) {
    productoActivo = productosBaseDatos[index];
    if (!productoActivo) return;

    document.getElementById("modalTitulo").innerText = productoActivo.nombre;
    document.getElementById("modalPrecio").innerText = `$${Number(productoActivo.precio || 0).toLocaleString("es-CO")} COP`;
    document.getElementById("modalDescripcion").innerText = productoActivo.descripcion;

    // Poblar carrusel
    const carrusel = document.getElementById("carruselImagenes");
    carrusel.innerHTML = "";
    const imgs = productoActivo.imagenes ? productoActivo.imagenes.split(",") : [productoActivo.imagenPrincipal];
    imgs.forEach(url => {
        const imgEl = document.createElement("img");
        imgEl.src = url.trim();
        imgEl.onclick = () => abrirZoom(url.trim());
        carrusel.appendChild(imgEl);
    });

    // Poblar variaciones / tonos
    const select = document.getElementById("selVariante");
    select.innerHTML = "";
    const tonos = productoActivo.tonos ? productoActivo.tonos.split(",") : ["Único"];
    tonos.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.trim();
        opt.innerText = `Tono: ${t.trim()}`;
        select.appendChild(opt);
    });

    document.getElementById("inpCant").value = 1;
    abrirModal();
}

function abrirModal() { 
    document.getElementById("modalProducto").style.display = "flex"; 
    setTimeout(actualizarFlechas, 100);
}
function cerrarModal() { document.getElementById("modalProducto").style.display = "none"; }

// --- CARRUSEL Y FLECHAS ---
const carrusel = document.getElementById("carruselImagenes");
const arrowLeft = document.getElementById("arrowLeft");
const arrowRight = document.getElementById("arrowRight");

function scrollCarrusel(direccion) {
    const paso = carrusel.clientWidth;
    carrusel.scrollBy({ left: direccion * paso, behavior: "smooth" });
}

function actualizarFlechas() {
    if (!carrusel) return;
    const scrollLeft = carrusel.scrollLeft;
    const maxScroll = carrusel.scrollWidth - carrusel.clientWidth;

    if (scrollLeft > 10) arrowLeft.classList.add("visible");
    else arrowLeft.classList.remove("visible");

    if (scrollLeft < maxScroll - 10) arrowRight.classList.add("visible");
    else arrowRight.classList.remove("visible");
}

if (carrusel) {
    carrusel.addEventListener("scroll", actualizarFlechas);
    window.addEventListener("resize", actualizarFlechas);
}

// --- TECLADO ACCESIBLE ---
document.addEventListener("keydown", (e) => {
    const modalProductoVisible = document.getElementById("modalProducto").style.display === "flex";
    const modalCarritoVisible = document.getElementById("modalCarrito").style.display === "flex";
    const lightboxVisible = document.getElementById("lightboxZoom").style.display === "block";

    if (e.key === "Escape") {
        if (lightboxVisible) { cerrarZoom(); return; }
        if (modalCarritoVisible) { cerrarCarrito(); return; }
        if (modalProductoVisible) { cerrarModal(); return; }
    }
});

// --- LIGHTBOX Y ZOOM ---
let scale = 1, pointX = 0, pointY = 0;
const viewport = document.getElementById("zoomViewport");
const imgTarget = document.getElementById("imgZoomTarget");

function updateTransform() {
    if (scale < 1) { scale = 1; pointX = 0; pointY = 0; }
    imgTarget.style.transform = `translate3d(${pointX}px, ${pointY}px, 0px) scale(${scale})`;
}

function abrirZoom(url) {
    imgTarget.src = url;
    scale = 1; pointX = 0; pointY = 0;
    updateTransform();
    document.getElementById("lightboxZoom").style.display = "block";
}

function cerrarZoom() { document.getElementById("lightboxZoom").style.display = "none"; }

// --- CARRITO DE COMPRAS ---
function cambiarCant(d) {
    const el = document.getElementById("inpCant");
    let v = +el.value + d;
    el.value = v < 1 ? 1 : v;
}

function agregarItem() {
    if (!productoActivo) return;

    const variante = document.getElementById("selVariante").value;
    const cantidad = +document.getElementById("inpCant").value;
    const itemNombre = `${productoActivo.nombre} (${variante})`;

    let carrito = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || "[]");
    const index = carrito.findIndex(i => i.nombre === itemNombre);
    
    if (index >= 0) { carrito[index].cantidad += cantidad; } 
    else { carrito.push({ nombre: itemNombre, precio: Number(productoActivo.precio || 0), cantidad: cantidad }); }

    localStorage.setItem(CLAVE_CARRITO, JSON.stringify(carrito));
    cerrarModal();
    cargarCarrito();
    abrirCarrito();
}

function abrirCarrito() { document.getElementById("modalCarrito").style.display = "flex"; }
function cerrarCarrito() { document.getElementById("modalCarrito").style.display = "none"; }

function cargarCarrito() {
    const carrito = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || "[]");
    const contenedor = document.getElementById("listaItems");
    let html = ""; let totalPagar = 0; let cantTotal = 0;

    if (carrito.length === 0) {
        contenedor.innerHTML = '<div class="carrito-vacio">Tu carrito está vacío.</div>';
        document.getElementById("totalPagar").innerText = "$0 COP";
        document.querySelectorAll(".badgeCant").forEach(el => el.innerText = "0");
        actualizarBarraEnvio(0);
        return;
    }

    carrito.forEach((item, index) => {
        const subtotal = item.precio * item.cantidad;
        totalPagar += subtotal; cantTotal += item.cantidad;
        
        html += `
        <div class="item-fila">
            <div style="flex:1;">
                <span class="item-nombre" style="display:block;">${item.nombre}</span>
                <div class="cant-contros-cart" style="display:inline-flex; margin-top:6px;">
                    <button type="button" class="btn-cant-cart" onclick="modificarCantidad(${index}, -1)">−</button>
                    <span class="num-cant-cart">${item.cantidad}</span>
                    <button type="button" class="btn-cant-cart" onclick="modificarCantidad(${index}, 1)">+</button>
                </div>
            </div>
            <span class="item-precio">$${subtotal.toLocaleString("es-CO")}</span>
        </div>`;
    });

    contenedor.innerHTML = html;
    document.getElementById("totalPagar").innerText = `$${totalPagar.toLocaleString("es-CO")} COP`;
    document.querySelectorAll(".badgeCant").forEach(el => el.innerText = cantTotal);
    actualizarBarraEnvio(totalPagar);
}

function actualizarBarraEnvio(total) {
    const txt = document.getElementById("txtEnvioGratis");
    const fill = document.getElementById("barEnvioGratis");

    if (total >= META_ENVIO) {
        txt.innerHTML = "🎉 ¡Felicidades! Tienes <strong>ENVÍO GRATUITO</strong>";
        fill.style.width = "100%";
    } else {
        const falta = META_ENVIO - total;
        const porcentaje = Math.min((total / META_ENVIO) * 100, 100);
        txt.innerHTML = `¡Agrega <strong>$${falta.toLocaleString("es-CO")}</strong> más y consigue envío gratuito!`;
        fill.style.width = `${porcentaje}%`;
    }
}

function modificarCantidad(index, cambio) {
    let carrito = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || "[]");
    if (carrito[index]) {
        carrito[index].cantidad += cambio;
        if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
        localStorage.setItem(CLAVE_CARRITO, JSON.stringify(carrito));
        cargarCarrito();
    }
}

function enviarPedido() {
    const carrito = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || "[]");
    if (carrito.length === 0) { alert("Tu carrito está vacío."); return; }

    let msj = "✨ *¡Hola! Gracias por elegir NexoShopping.*\n\n";
    msj += "Recibimos tu solicitud con éxito. Tu pedido es el siguiente:\n\n";
    carrito.forEach(i => { msj += `▪️ ${i.nombre} (${i.cantidad} ud)\n`; });
    msj += "\n-----------------------------------\n\n";
    msj += "Para finalizar tu compra por favor indícanos:\n\n";
    msj += "1. *Medio de pago que utilizarás:* (Nequi, Daviplata, Breve o Banco).\n";
    msj += "2. *Dirección exacta de envío:* Incluyendo ciudad, barrio y complementos.\n\n";

    window.open(`https://wa.me/${TELEFONO_WA}?text=${encodeURIComponent(msj)}`, "_blank");
    localStorage.removeItem(CLAVE_CARRITO);
    cargarCarrito();
    cerrarCarrito();
}
